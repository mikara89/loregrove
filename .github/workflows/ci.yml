name: Production CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "spikes/**"

jobs:
  core:
    name: Core validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Loregrove.Core.slnx
      - run: dotnet format Loregrove.Core.slnx --verify-no-changes --no-restore
      - run: dotnet test Loregrove.Core.slnx -c Release --no-restore

  windows:
    name: Windows desktop
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: dotnet restore src/Loregrove.Desktop/Loregrove.Desktop.csproj -p:RuntimeIdentifierOverride=win-x64
      - run: dotnet build src/Loregrove.Desktop/Loregrove.Desktop.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore -p:RuntimeIdentifierOverride=win-x64
      - run: dotnet test Loregrove.Core.slnx -c Release

  macos:
    name: Mac Catalyst build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - run: dotnet workload install maui
      - run: dotnet restore src/Loregrove.Desktop/Loregrove.Desktop.csproj
      - run: dotnet build src/Loregrove.Desktop/Loregrove.Desktop.csproj -f net10.0-maccatalyst -c Release --no-restore -p:EnableCodeSigning=false
      - run: dotnet test Loregrove.Core.slnx -c Release
